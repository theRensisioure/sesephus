<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sesefus · Record</title>
  <style>
    /* matrixentropic — Matrix film feel: phosphor green on black, compact, edge grit */
    :root {
      --void: #030605;
      --bg: #050a07;
      --panel: #0a120e;
      --panel-2: #0d1812;
      --line: #1a3328;
      --line-soft: #12241c;
      --text: #b8e0c8;
      --muted: #5a8a6e;
      --green: #3dcc6a;        /* primary phosphor — not pure #0f0 thrash */
      --green-bright: #5dff8a;
      --green-dim: #1f6b3a;
      --green-deep: #0d2818;
      --edge: #143d28;         /* rough frame edge */
      --warn: #8a7a2a;         /* dark amber only, rare */
      --mono: "Cascadia Mono", "Consolas", "Courier New", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--void);
      color: var(--text);
      font: 12px/1.45 var(--mono);
    }
    body {
      min-height: 100vh;
      border: 2px solid var(--edge);
      box-shadow:
        inset 0 0 0 1px var(--line-soft),
        inset 0 0 48px rgba(0, 40, 20, 0.45);
      /* faint code-rain suggestion — edges only, low opacity */
      background-image:
        linear-gradient(180deg, transparent 0%, rgba(61, 204, 106, 0.03) 50%, transparent 100%),
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 11px,
          rgba(61, 204, 106, 0.035) 11px,
          rgba(61, 204, 106, 0.035) 12px
        );
      background-color: var(--bg);
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      border-left: 3px solid var(--green-dim);
    }
    header h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green);
    }
    header h1 span {
      color: var(--muted);
      font-weight: 400;
      letter-spacing: 0.08em;
    }
    header .sub {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.04em;
    }
    main {
      padding: 12px;
      max-width: 400px;
      margin: 0 auto;
    }
    .stat {
      font-size: 10px;
      color: var(--muted);
      margin: 0 0 10px;
      padding: 6px 8px;
      background: var(--panel-2);
      border: 1px solid var(--line-soft);
      border-radius: 2px;
      border-right: 2px solid var(--edge);
      word-break: break-all;
    }
    .stat b { color: var(--green); font-weight: 600; }
    .cta {
      display: block;
      width: 100%;
      margin: 0 0 12px;
      padding: 11px 12px;
      font: 600 12px/1.2 var(--mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--green-bright);
      background: var(--green-deep);
      border: 1px solid var(--green-dim);
      border-bottom: 2px solid var(--green);
      border-radius: 2px;
      cursor: pointer;
    }
    .cta:hover {
      color: #e8ffe8;
      border-color: var(--green);
      background: #0f2a1a;
    }
    .cta:focus-visible {
      outline: 1px solid var(--green);
      outline-offset: 2px;
    }
    .cta:active { transform: translateY(1px); }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: 2px;
      padding: 10px;
      margin: 0 0 10px;
      border-top: 1px solid var(--edge);
    }
    .panel h2 {
      margin: 0 0 8px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--green-dim);
    }
    .row {
      display: flex;
      gap: 6px;
      align-items: stretch;
      margin-bottom: 8px;
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 7px 8px;
      font: 12px var(--mono);
      color: var(--green);
      background: var(--void);
      border: 1px solid var(--line);
      border-radius: 2px;
      caret-color: var(--green-bright);
    }
    input[type="text"]::placeholder { color: var(--muted); opacity: 0.7; }
    input[type="text"]:focus {
      border-color: var(--green-dim);
      outline: none;
      box-shadow: 0 0 0 1px rgba(61, 204, 106, 0.15);
    }
    button.sec {
      padding: 7px 10px;
      font: 600 10px var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 2px;
      cursor: pointer;
      white-space: nowrap;
    }
    button.sec:hover { border-color: var(--green-dim); color: var(--green-bright); }
    button.sec:focus-visible {
      outline: 1px solid var(--green);
      outline-offset: 1px;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 200px;
      overflow: auto;
    }
    li {
      padding: 7px 4px;
      border-bottom: 1px solid var(--line-soft);
      font-size: 11px;
      color: var(--muted);
    }
    li:last-child { border-bottom: none; }
    li .name {
      color: var(--text);
      font-weight: 600;
      font-size: 12px;
    }
    li .sha { color: var(--green); }
    li .st {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 5px;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--green-bright);
      border: 1px solid var(--green-dim);
      border-radius: 2px;
      vertical-align: middle;
    }
    footer {
      padding: 8px 12px 14px;
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.06em;
      opacity: 0.8;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      max-width: 90%;
      padding: 8px 12px;
      font: 600 11px var(--mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--green-bright);
      background: var(--panel);
      border: 1px solid var(--green-dim);
      border-left: 3px solid var(--green);
      border-radius: 2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .toast.show { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Sesefus <span>// record</span></h1>
    <div class="sub">active on ingest</div>
  </header>
  <main>
    <div class="stat" id="stat">…</div>
    <button class="cta" id="btnIngest" type="button">Ingest → active index</button>

    <div class="panel">
      <h2>lookup // sha prefix</h2>
      <div class="row">
        <input id="q" type="text" placeholder="sha8 / sha16…" autocomplete="off" spellcheck="false" />
        <button class="sec" id="btnLookup" type="button">Find</button>
      </div>
      <ul id="hits"></ul>
    </div>

    <div class="panel">
      <h2>active</h2>
      <ul id="list"></ul>
    </div>
  </main>
  <footer>sesefus-record · 127.0.0.1:8778 · alarms later</footer>
  <div class="toast" id="toast"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    function toast(m) {
      const t = $("toast");
      t.textContent = m;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }
    function bytes(n) {
      if (n > 1e6) return (n / 1e6).toFixed(2) + " MB";
      if (n > 1e3) return (n / 1e3).toFixed(1) + " KB";
      return n + " B";
    }
    function renderList(el, rows, emptyMsg) {
      el.innerHTML = "";
      if (!rows || !rows.length) {
        el.innerHTML = "<li>" + (emptyMsg || "empty — record, then ingest") + "</li>";
        return;
      }
      rows.forEach((r) => {
        const li = document.createElement("li");
        li.innerHTML =
          `<span class="name">${r.name || "?"}</span>` +
          `<span class="st">${(r.status || "active")}</span><br>` +
          `<span class="sha">${r.sha8}…</span> · ${bytes(r.size || 0)}` +
          (r.ingested_at ? `<br>${r.ingested_at}` : "");
        el.appendChild(li);
      });
    }
    async function api(path, opts) {
      const r = await fetch(path, opts);
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "fail");
      return j;
    }
    async function refresh() {
      const st = await api("/api/status");
      $("stat").innerHTML =
        `<b>active ${st.active_count}</b> · ${st.sound_dir}`;
      const rec = await api("/api/recent");
      renderList($("list"), rec.rows || []);
    }
    $("btnIngest").onclick = async () => {
      try {
        const j = await api("/api/scan", { method: "POST" });
        toast(`+${j.added_or_updated} · active ${j.active_count}`);
        await refresh();
      } catch (e) {
        toast(String(e.message || e));
      }
    };
    async function lookup() {
      try {
        const q = $("q").value.trim();
        const j = await api("/api/by-prefix?q=" + encodeURIComponent(q));
        renderList($("hits"), j.rows || [], "no hit — longer prefix or ingest");
      } catch (e) {
        toast(String(e.message || e));
      }
    }
    $("btnLookup").onclick = lookup;
    $("q").addEventListener("keydown", (e) => {
      if (e.key === "Enter") lookup();
    });
    refresh().catch((e) => {
      $("stat").textContent = String(e.message || e);
    });
    setInterval(() => refresh().catch(() => {}), 20000);
  </script>
</body>
</html>
