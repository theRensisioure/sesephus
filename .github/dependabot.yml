# Dependabot — weekly dependency-update PRs across the repo's ecosystems.
# Alerts (the security side) are enabled separately on the repo itself.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"                 # requirements.txt + requirements-dev.txt
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]

  - package-ecosystem: "npm"
    directory: "/dashboard/ui"     # the React/Vite dashboard
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]

  - package-ecosystem: "github-actions"
    directory: "/"                 # keep the CI actions themselves current
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
