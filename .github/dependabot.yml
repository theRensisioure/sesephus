# Dependabot — monthly. 0.1.0 is a snapshot; weekly opened ten PRs on day one.
# Alerts (the security side) stay on the repo itself.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"                 # requirements.txt + requirements-dev.txt
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "python"]

  - package-ecosystem: "npm"
    directory: "/dashboard/ui"     # the React/Vite dashboard
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "javascript"]

  - package-ecosystem: "github-actions"
    directory: "/"                 # keep the CI actions themselves current
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "ci"]
