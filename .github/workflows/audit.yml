name: Weekly audit

# Heavier, history-wide scans that shouldn't gate every push. Runs Mondays 07:00
# UTC and on demand. A finding here means something already made it into history.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    name: History secret + vault audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.21.2
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: gitleaks (full history)
        run: gitleaks detect --redact --no-banner
      - name: Vault history audit
        run: bash tools/guard_vaults.sh --history
